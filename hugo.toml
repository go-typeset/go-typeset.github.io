baseURL = 'https://go-typeset.github.io/'
locale  = 'en-us'
title   = 'go-typeset'
# No theme — layouts live in ./layouts

disableKinds = ['taxonomy', 'term', 'rss', 'sitemap']

# The design comes from the landing kit, a Hugo module pinned in go.mod.
[module]
  [[module.imports]]
    path = "github.com/go-fleettools/landingkit"

[params]
  description = "go-typeset is the pure-Go (CGO=0) home of the algorithms that place marks on a page — Knuth–Plass line breaking, Liang hyphenation and the Unicode bidirectional algorithm — extracted from the go-tex engine and usable by anything that lays out text."
  brandName       = "go-typeset"
  github      = "go-typeset"
  heroAccent  = "go-typeset"
  accent       = "#4338CA"
  accent2      = "#4F46E5"
  accent3      = "#6366F1"
  accentDark   = "#818CF8"
  accentDark2  = "#A5B4FC"
  accentDark3  = "#C7D2FE"
  titleSuffix = "the algorithms that place marks on a page"
  heroTagline = "Typesetting, not typography. Where the marks go, not what they look like."

  heroIntro = [
    "<strong>go-typeset</strong> holds the algorithms that decide <em>where</em> text goes: <strong>Knuth–Plass</strong> optimal line breaking, <strong>Liang</strong> hyphenation, and the <strong>Unicode bidirectional algorithm</strong>. Pure Go, cgo-free, standard library only, <strong>100% test coverage</strong>.",
    "They came out of the <a href=\"https://github.com/go-tex/engine\">go-tex</a> engine, where they were already written as self-contained algorithms with no reference to engine state — so extracting them was a move, not a rewrite. Their public API carries <strong>no TeX vocabulary</strong>, because a paragraph breaker is not a TeX component."
  ]

[menu]
  [[menu.main]]
    identifier = "why"
    name       = "Why"
    url        = "#why"
    weight     = 10
  [[menu.main]]
    identifier = "packages"
    name       = "Packages"
    url        = "#packages"
    weight     = 20
  [[menu.main]]
    identifier = "quality"
    name       = "Quality"
    url        = "#quality"
    weight     = 30

[params.brand]
# Generated by go-fleettools/landingkit from static/img/logo.svg: the colours are
# READ from the logo's gradient, never chosen. Do not add other keys:
# neutrals (backgrounds, surfaces, greys) belong to the shared sheet.
# Contrast: base on white 15.99:1, bright on the dark background 3.07:1.
  base = "#1e1b4b"
  deep = "#12102e"
  bright = "#4f46e5"
  shadow = "rgba(30,27,75,.7)"
  glow = "rgba(30,27,75,.6)"
  wash = "rgba(30,27,75,.10)"
  washDeep = "rgba(18,16,46,.06)"
  chipBg = "#eae9fc"
  chipBorder = "#cac8f7"
  chipFg = "#12102e"
  chipBgDark = "rgba(79,70,229,.14)"
  chipBorderDark = "rgba(79,70,229,.32)"
  chipFgDark = "#9e99f1"
  statsEnd = "#d5d3f9"
  bandText = "#e3e1fb"
  accent = "#1e1b4b"
  accentDark = "#726bea"

# The hero's buttons, rendered by landingkit's cta.html in the kit's order.
[[params.cta]]
  kind  = "docs"
  href  = "https://github.com/go-typeset/linebreak"
  label = "linebreak"
[[params.cta]]
  kind  = "github"
  href  = "https://github.com/go-typeset"
  label = "GitHub"
